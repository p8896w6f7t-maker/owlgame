<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>부엉이 키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#17110f;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}


/* ==================================================
   게임
================================================== */

#game{

    position:relative;

    width:min(100vw,100vh);
    height:min(100vw,100vh);

    max-width:620px;
    max-height:620px;

    overflow:hidden;

    background:#5a4032;

    border-radius:8%;

    touch-action:manipulation;

    isolation:isolate;
}


/* ==================================================
   배경
================================================== */

#background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

    pointer-events:none;

    transition:
        opacity .5s ease;
}


/* ==================================================
   밤 오버레이
================================================== */

#nightOverlay{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        rgba(20,12,10,0);

    transition:
        background .8s ease;
}


/* ==================================================
   소품 영역
================================================== */

#props{

    position:absolute;

    inset:0;

    z-index:4;

    pointer-events:none;
}


/* ==================================================
   기본 소품
================================================== */

.prop{

    position:absolute;

    display:block;

    object-fit:contain;

    pointer-events:auto;

    cursor:pointer;

    transform-origin:center bottom;

    transition:
        transform .12s ease;
}


/* ==================================================
   선반
   오른쪽에서 왼쪽 빈 공간으로 이동
================================================== */

#shelf{

    width:30%;

    left:5.5%;

    top:17%;

    right:auto;
}


/* ==================================================
   램프
================================================== */

#lamp{

    width:21%;

    right:3%;

    top:4%;

    transform-origin:50% 8%;
}


/* ==================================================
   화분
================================================== */

#plant{

    width:23%;

    left:5.5%;

    bottom:22%;

    transform-origin:50% 100%;
}


/* ==================================================
   책
   선반 위쪽으로 이동
================================================== */

#booksStanding{

    width:20%;

    left:10%;

    top:20%;

    bottom:auto;

    transform-origin:50% 100%;
}


#booksHorizontal{

    width:18%;

    left:9%;

    top:26%;

    bottom:auto;

    transform-origin:50% 100%;
}


/* ==================================================
   쪽지
================================================== */

#note{

    width:15%;

    right:16%;

    top:27%;

    transform-origin:50% 5%;
}


/* ==================================================
   둥지
   기존보다 크게
================================================== */

#nest{

    position:absolute;

    width:52%;

    left:50%;

    bottom:14%;

    transform:
        translateX(-50%);

    z-index:5;

    pointer-events:auto;

    cursor:pointer;

    transform-origin:center bottom;

    transition:
        transform .12s ease;
}


/* ==================================================
   부엉이 영역
================================================== */

#owlArea{

    position:absolute;

    left:50%;

    bottom:20%;

    width:40%;

    height:39%;

    transform:
        translateX(-50%);

    z-index:8;

    display:flex;

    justify-content:center;

    align-items:flex-end;

    pointer-events:auto;

    cursor:pointer;
}


/* ==================================================
   부엉이
================================================== */

#owl{

    display:block;

    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
        drop-shadow(
            0 3px 0
            rgba(55,34,25,.2)
        );

    transform-origin:center bottom;

    transition:
        transform .15s ease,
        opacity .15s ease;
}


/* ==================================================
   부엉이 점프
================================================== */

.owl-jump{

    animation:
        owlJump
        .32s
        ease-out;
}


@keyframes owlJump{

    0%{
        transform:
            translateY(0)
            scale(1);
    }

    45%{
        transform:
            translateY(-9px)
            scale(1.04);
    }

    100%{
        transform:
            translateY(0)
            scale(1);
    }

}


/* ==================================================
   부엉이 흔들림
================================================== */

.owl-wiggle{

    animation:
        owlWiggle
        .42s
        ease-in-out;
}


@keyframes owlWiggle{

    0%{
        transform:rotate(0deg);
    }

    25%{
        transform:rotate(-4deg);
    }

    50%{
        transform:rotate(4deg);
    }

    75%{
        transform:rotate(-2deg);
    }

    100%{
        transform:rotate(0deg);
    }

}


/* ==================================================
   소품 흔들림
================================================== */

.shake{

    animation:
        propShake
        .42s
        ease-in-out;
}


@keyframes propShake{

    0%{
        transform:
            rotate(0deg)
            translateX(0);
    }

    20%{
        transform:
            rotate(-4deg)
            translateX(-2px);
    }

    40%{
        transform:
            rotate(4deg)
            translateX(2px);
    }

    60%{
        transform:
            rotate(-3deg)
            translateX(-1px);
    }

    80%{
        transform:
            rotate(2deg)
            translateX(1px);
    }

    100%{
        transform:
            rotate(0deg)
            translateX(0);
    }

}


/* ==================================================
   램프 흔들림
================================================== */

.lamp-shake{

    animation:
        lampShake
        .65s
        ease-in-out;
}


@keyframes lampShake{

    0%{
        transform:rotate(0deg);
    }

    20%{
        transform:rotate(-5deg);
    }

    40%{
        transform:rotate(4deg);
    }

    60%{
        transform:rotate(-3deg);
    }

    80%{
        transform:rotate(2deg);
    }

    100%{
        transform:rotate(0deg);
    }

}


/* ==================================================
   둥지 흔들림
================================================== */

.nest-shake{

    animation:
        nestShake
        .45s
        ease-in-out;
}


@keyframes nestShake{

    0%{
        transform:
            translateX(-50%)
            rotate(0);
    }

    25%{
        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    50%{
        transform:
            translateX(-50%)
            rotate(3deg);
    }

    75%{
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    100%{
        transform:
            translateX(-50%)
            rotate(0);
    }

}


/* ==================================================
   말풍선
================================================== */

#bubble{

    position:absolute;

    left:50%;

    bottom:53%;

    min-width:70px;

    max-width:180px;

    padding:
        9px 15px;

    transform:
        translateX(-50%)
        translateY(5px)
        scale(.8);

    opacity:0;

    z-index:30;

    background:#fff6e3;

    border:
        3px solid #593a2b;

    border-radius:18px;

    color:#3d281f;

    font-size:
        clamp(
            17px,
            4vw,
            25px
        );

    font-weight:900;

    text-align:center;

    line-height:1;

    white-space:nowrap;

    box-shadow:
        0 3px 0
        rgba(70,42,30,.2);

    pointer-events:none;

    transition:
        opacity .15s ease,
        transform .15s ease;
}


#bubble.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* ==================================================
   말풍선 꼬리
================================================== */

#bubble::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:-10px;

    width:15px;
    height:15px;

    background:#fff6e3;

    border-right:
        3px solid #593a2b;

    border-bottom:
        3px solid #593a2b;

    transform:
        translateX(-50%)
        rotate(45deg);
}


/* ==================================================
   효과
================================================== */

#effects{

    position:absolute;

    inset:0;

    z-index:25;

    pointer-events:none;

    overflow:hidden;
}


.effect{

    position:absolute;

    width:11%;

    height:auto;

    object-fit:contain;

    animation:
        effectPop
        .85s
        ease-out
        forwards;
}


@keyframes effectPop{

    0%{
        opacity:0;

        transform:
            scale(.3)
            translateY(15px);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            scale(1.15)
            translateY(-35px);
    }

}


/* ==================================================
   버튼
================================================== */

#buttons{

    position:absolute;

    left:4.2%;
    right:4.2%;

    bottom:3%;

    height:20%;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:2.5%;

    z-index:40;
}


.action{

    border:0;

    padding:0;
    margin:0;

    background:transparent;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    touch-action:manipulation;
}


.action img{

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
        drop-shadow(
            0 2px 0
            rgba(65,39,28,.2)
        );

    transition:
        transform .1s ease;
}


.action:active img{

    transform:
        scale(.93);
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(
            38,
            24,
            18,
            .22
        );
}


#startCard{

    width:70%;

    padding:
        22px 18px;

    background:#fff4df;

    border:
        4px solid #5b3b2b;

    border-radius:24px;

    text-align:center;

    box-shadow:
        0 5px 0
        rgba(65,40,28,.25);
}


#startEgg{

    display:block;

    width:32%;

    max-width:125px;

    margin:
        0 auto
        9px;
}


#startTitle{

    color:#4c3023;

    font-size:
        clamp(
            22px,
            5vw,
            34px
        );

    font-weight:900;

    margin-bottom:5px;
}


#startSub{

    color:#4c3023;

    opacity:.7;

    font-size:
        clamp(
            12px,
            2.8vw,
            17px
        );

    font-weight:700;

    margin-bottom:17px;
}


#startButton{

    padding:
        10px 24px;

    border:
        3px solid #5b3b2b;

    border-radius:15px;

    background:#e7c28f;

    color:#4c3023;

    font-size:
        clamp(
            15px,
            3.5vw,
            20px
        );

    font-weight:900;

    box-shadow:
        0 3px 0
        #8b6247;

    cursor:pointer;
}


#startButton:active{

    transform:
        translateY(2px);

    box-shadow:
        0 1px 0
        #8b6247;
}


/* ==================================================
   모바일
================================================== */

@media(max-width:430px){

    #game{

        width:100vw;
        height:100vw;

        border-radius:0;

    }

}


@media(orientation:landscape){

    #game{

        width:100vh;
        height:100vh;

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- ==========================================
         배경
    =========================================== -->

    <img
        id="background"
        src="bg_day.png"
        alt=""
    >


    <div id="nightOverlay"></div>


    <!-- ==========================================
         소품
    =========================================== -->

    <div id="props">


        <img
            id="shelf"
            class="prop"
            src="shelf.png"
            alt=""
            data-prop="shelf"
        >


        <img
            id="lamp"
            class="prop"
            src="lamp.png"
            alt=""
            data-prop="lamp"
        >


        <img
            id="plant"
            class="prop"
            src="plant.png"
            alt=""
            data-prop="plant"
        >


        <img
            id="booksStanding"
            class="prop"
            src="books_standing.png"
            alt=""
            data-prop="books"
        >


        <img
            id="booksHorizontal"
            class="prop"
            src="books_horizontal.png"
            alt=""
            data-prop="books"
        >


        <img
            id="note"
            class="prop"
            src="note.png"
            alt=""
            data-prop="note"
        >


    </div>


    <!-- ==========================================
         둥지
    =========================================== -->

    <img
        id="nest"
        src="nest.png"
        alt=""
    >


    <!-- ==========================================
         부엉이
    =========================================== -->

    <div id="owlArea">

        <img
            id="owl"
            src="egg.png"
            alt="부엉이"
        >

    </div>


    <!-- ==========================================
         말풍선
    =========================================== -->

    <div id="bubble"></div>


    <!-- ==========================================
         효과
    =========================================== -->

    <div id="effects"></div>


    <!-- ==========================================
         버튼
    =========================================== -->

    <div id="buttons">


        <button
            id="feedButton"
            class="action"
            type="button"
            aria-label="먹이주기"
        >

            <img
                src="button_feed.png"
                alt="먹이주기"
            >

        </button>


        <button
            id="playButton"
            class="action"
            type="button"
            aria-label="놀아주기"
        >

            <img
                src="button_play.png"
                alt="놀아주기"
            >

        </button>


        <button
            id="petButton"
            class="action"
            type="button"
            aria-label="쓰다듬기"
        >

            <img
                src="button_pet.png"
                alt="쓰다듬기"
            >

        </button>


        <button
            id="talkButton"
            class="action"
            type="button"
            aria-label="말걸기"
        >

            <img
                src="button_talk.png"
                alt="말걸기"
            >

        </button>


    </div>


    <!-- ==========================================
         시작 화면
    =========================================== -->

    <div id="startScreen">

        <div id="startCard">


            <img
                id="startEgg"
                src="egg.png"
                alt=""
            >


            <div id="startTitle">
                부엉이 키우기
            </div>


            <div id="startSub">
                작은 알에서 시작합니다
            </div>


            <button
                id="startButton"
                type="button"
            >
                시작하기
            </button>


        </div>

    </div>


</div>



<script>

/* ==================================================
   DOM
================================================== */

const $ =
    id =>
        document.getElementById(id);


const background =
    $("background");

const nightOverlay =
    $("nightOverlay");

const owl =
    $("owl");

const owlArea =
    $("owlArea");

const bubble =
    $("bubble");

const effects =
    $("effects");

const nest =
    $("nest");

const startScreen =
    $("startScreen");

const startButton =
    $("startButton");


/* ==================================================
   이모티콘
================================================== */

const EMOTES = {

    idle:[
        "•ᴗ•",
        "ᵔᴥᵔ",
        "*⸌☻ັ⸍*",
        "•_•",
        "◔ᴗ◔"
    ],

    happy:[
        "•ᴗ•♡",
        "ᵔᴥᵔ♡",
        "(˶ᵔ ᵕ ᵔ˶)",
        "♡ᴗ♡"
    ],

    feed:[
        "ᵔڡᵔ",
        "(๑•ᴗ•๑)",
        "(っ˘ڡ˘ς)",
        "•ᴗ•♡"
    ],

    play:[
        "(ง •̀ᴗ•́)ง",
        "(๑˃ᴗ˂)ﻭ",
        "٩(ˊᗜˋ*)و",
        "•ᴗ•✧"
    ],

    pet:[
        "-`♥´-",
        "(˶ᵔ ᵕ ᵔ˶)",
        "(ฅ´ω`ฅ)",
        "♡ᴗ♡"
    ],

    talk:[
        "•ᴗ•?",
        "ᵔᴥᵔ?",
        "(•ө•)？",
        "•_•?"
    ],

    confused:[
        "•ᴗ•?",
        "(⊙_⊙)?",
        "ᵔᴥᵔ?",
        "•_•?"
    ],

    sleepy:[
        "-ᴗ- zZ",
        "(－_－) zzZ",
        "ᵕᴗᵕ zZ",
        "ᵕᴗᵕ..."
    ],

    back:[
        "...",
        "•_•",
        "ᵕ_ᵕ",
        "-_-"
    ],

    surprise:[
        "!",
        "•ᴗ•!",
        "✧ᴗ✧",
        "(⊙o⊙)"
    ],

    annoyed:[
        "•_•",
        "-_-",
        "ಠ_ಠ",
        "•︵•"
    ],

    curious:[
        "•ᴗ•?",
        "ᵔᴥᵔ",
        "◔ᴗ◔",
        "(•ө•)"
    ]

};


/* ==================================================
   성장 단계
================================================== */

/*
   아기 → 성체 사이에
   별도 이미지 없음.

   egg
   ↓
   egg_cracked
   ↓
   owl_hatching
   ↓
   owl_baby
   ↓
   owl_normal
*/

const STAGES = [

    {
        key:"egg",
        file:"egg",
        need:0
    },

    {
        key:"cracked",
        file:"egg_cracked",
        need:5
    },

    {
        key:"hatching",
        file:"owl_hatching",
        need:7
    },

    {
        key:"baby",
        file:"owl_baby",
        need:9
    },

    {
        key:"adult",
        file:"owl_normal",
        need:16
    }

];


/* ==================================================
   저장
================================================== */

const SAVE_KEY =
    "owlWidgetGame_v4";


let gameData = null;


try{

    gameData =
        JSON.parse(
            localStorage.getItem(
                SAVE_KEY
            )
        );

}catch(error){

    gameData = null;

}


if(
    !gameData
){

    gameData = {

        started:false,

        stage:0,

        clicks:0,

        lastAction:"idle",

        lastInteraction:
            Date.now(),

        totalFeed:0,

        totalPlay:0,

        totalPet:0,

        totalTalk:0,

        propsTouched:0

    };

}


/* ==================================================
   저장 함수
================================================== */

function save(){

    try{

        localStorage.setItem(

            SAVE_KEY,

            JSON.stringify(
                gameData
            )

        );

    }catch(error){

    }

}


/* ==================================================
   랜덤
================================================== */

function random(
    array
){

    return array[
        Math.floor(
            Math.random()
            *
            array.length
        )
    ];

}


/* ==================================================
   현실 시간
================================================== */

function getTimeState(){

    const now =
        new Date();

    const hour =
        now.getHours();

    const minute =
        now.getMinutes();

    const totalMinutes =
        hour * 60 + minute;


    /*
       06:00 ~ 18:59 = 낮
       19:00 ~ 05:59 = 밤
    */

    const isNight =
        totalMinutes >= 1140 ||
        totalMinutes < 360;


    return {

        hour,
        minute,
        isNight

    };

}


/* ==================================================
   낮 / 밤
================================================== */

function updateDayNight(){

    const time =
        getTimeState();


    if(
        time.isNight
    ){

        background.src =
            "bg_night.png";


        nightOverlay.style.background =
            "rgba(20,12,10,.05)";

    }

    else{

        background.src =
            "bg_day.png";


        nightOverlay.style.background =
            "rgba(20,12,10,0)";

    }


    /*
       성체이고 밤이면 잠
    */

    if(
        gameData.started &&
        gameData.stage === 4 &&
        time.isNight
    ){

        if(
            Date.now()
            -
            gameData.lastInteraction
            >
            5000
        ){

            setOwl(
                "owl_sleep"
            );

        }

    }

}


/* ==================================================
   현재 성장 단계
================================================== */

function getStage(){

    return STAGES[
        Math.min(
            gameData.stage,
            STAGES.length - 1
        )
    ];

}


/* ==================================================
   부엉이 변경
================================================== */

function setOwl(
    file,
    animation=""
){

    owl.src =
        file + ".png";


    if(
        animation
    ){

        owl.classList.remove(
            animation
        );


        void owl.offsetWidth;


        owl.classList.add(
            animation
        );

    }

}


/* ==================================================
   말풍선
================================================== */

let bubbleTimer =
    null;


function showBubble(
    text,
    duration=1100
){

    clearTimeout(
        bubbleTimer
    );


    bubble.textContent =
        text;


    bubble.classList.add(
        "show"
    );


    bubbleTimer =
        setTimeout(

            () => {

                bubble.classList.remove(
                    "show"
                );

            },

            duration

        );

}


/* ==================================================
   효과
================================================== */

function createEffect(
    file,
    x=.5,
    y=.4
){

    if(
        !file
    ){

        return;

    }


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "effect";


    img.src =
        file + ".png";


    img.style.left =
        (
            x * 100 - 5.5
        ) + "%";


    img.style.top =
        (
            y * 100 - 5
        ) + "%";


    effects.appendChild(
        img
    );


    setTimeout(

        () => {

            img.remove();

        },

        900

    );

}


/* ==================================================
   성장 체크
================================================== */

function checkGrowth(){

    /*
       다음 단계가 있는 동안만 검사
    */

    if(
        gameData.stage
        <
        STAGES.length - 1
    ){

        const nextStage =
            STAGES[
                gameData.stage + 1
            ];


        if(
            gameData.clicks >=
            nextStage.need
        ){

            gameData.stage++;


            setOwl(
                nextStage.file,
                "owl-jump"
            );


            showBubble(
                random(
                    EMOTES.surprise
                ),
                1300
            );


            createEffect(
                "effect_sparkle",
                .5,
                .4
            );


            createEffect(
                "effect_heart",
                .6,
                .4
            );


            save();

        }

    }

}


/* ==================================================
   성장 중 터치
================================================== */

function touchGrowingOwl(){

    if(
        !gameData.started
    ){

        return;

    }


    gameData.lastInteraction =
        Date.now();


    /*
       아기까지는 터치로 성장
    */

    if(
        gameData.stage < 4
    ){

        gameData.clicks++;


        checkGrowth();


        /*
           알
        */

        if(
            gameData.stage === 0
        ){

            setOwl(
                "egg",
                "owl-wiggle"
            );


            showBubble(
                random(
                    EMOTES.curious
                )
            );

        }


        /*
           금 간 알
        */

        else if(
            gameData.stage === 1
        ){

            setOwl(
                "egg_cracked",
                "owl-wiggle"
            );


            showBubble(
                random(
                    EMOTES.surprise
                )
            );


            createEffect(
                "effect_action",
                .5,
                .37
            );

        }


        /*
           부화
        */

        else if(
            gameData.stage === 2
        ){

            setOwl(
                "owl_hatching",
                "owl-jump"
            );


            showBubble(
                random(
                    EMOTES.surprise
                )
            );

        }


        /*
           아기
        */

        else if(
            gameData.stage === 3
        ){

            setOwl(
                "owl_baby",
                "owl-jump"
            );


            showBubble(
                random(
                    EMOTES.happy
                )
            );

        }


        save();

        return;

    }


    /*
       여기부터 성체
    */

    adultTouch();

}


/* ==================================================
   성체 터치
================================================== */

function adultTouch(){

    gameData.lastInteraction =
        Date.now();


    const reaction =
        random([

            "head",

            "back",

            "peek",

            "normal"

        ]);


    if(
        reaction === "head"
    ){

        setOwl(
            "owl_head_tilt",
            "owl-wiggle"
        );


        showBubble(
            random(
                EMOTES.confused
            )
        );


        createEffect(
            "effect_question",
            .65,
            .28
        );

    }


    else if(
        reaction === "back"
    ){

        setOwl(
            "owl_back"
        );


        showBubble(
            random(
                EMOTES.back
            )
        );

    }


    else if(
        reaction === "peek"
    ){

        setOwl(
            "owl_peek",
            "owl-wiggle"
        );


        showBubble(
            random(
                EMOTES.curious
            )
        );

    }


    else{

        setOwl(
            "owl_normal",
            "owl-wiggle"
        );


        showBubble(
            random(
                EMOTES.idle
            )
        );

    }


    save();

}


/* ==================================================

================================================== */

function canInteract(){

    if(
        !gameData.started
    ){

        return false;

    }


    if(
        gameData.stage < 3
    ){

        showBubble(
            random(
                EMOTES.curious
            )
        );


        return false;

    }


    return true;

}

/* ==================================================

================================================== */

function propInteraction(
    type,
    element
){

    if(
        !gameData.started
    ){

        return;

    }


    gameData.propsTouched++;

    gameData.lastInteraction =
        Date.now();


    element.classList.remove(
        "shake",
        "lamp-shake"
    );


    void element.offsetWidth;


    /*
       선반
    */

    if(
        type === "shelf"
    ){

        element.classList.add(
            "shake"
        );


        setOwl(
            "owl_peek"
        );


        showBubble(
            random(
                EMOTES.curious
            )
        );

    }


    /*
       램프
    */

    else if(
        type === "lamp"
    ){

        element.classList.add(
            "lamp-shake"
        );


        setOwl(
            "owl_head_tilt",
            "owl-wiggle"
        );


        showBubble(
            random(
                EMOTES.curious
            )
        );


        createEffect(
            "effect_sparkle_small",
            .75,
            .28
        );

    }


    /*
       화분
    */

    else if(
        type === "plant"
    ){

        element.classList.add(
            "shake"
        );


        setOwl(
            "owl_head_tilt"
        );


        showBubble(
            random(
                EMOTES.curious
            )
        );


        createEffect(
            "effect_question",
            .35,
            .3
        );

    }


    /*
       책
    */

        type === "books"
    ){

        element.classList.add(
            "shake"
        );


        setOwl(
            "owl_normal"
        );


        showBubble(
            random(
                EMOTES.idle
            )
        );

    }


    /*
       쪽지
    */

    else if(
        type === "note"

        setOwl(
            "owl_head_tilt"

    save();


    resetIdleTimer();

/* ==================================================
   자율 행동 타이머
================================================== */

let idleTimer =
    null;


function resetIdleTimer(){

    clearTimeout(
        idleTimer
    );


    idleTimer =
        setTimeout(

            autonomousBehavior,

            7000 +
            Math.random() * 9000

        );

}


/* ==================================================
   부엉이 자율 행동
================================================== */

function autonomousBehavior(){

    if(
        !gameData.started
    ){

        return;

    }


    /*
       아직 성체가 아니면
       자율 행동 없음
    */

    if(
        gameData.stage < 4
    ){

        return;

    }


    const time =
        getTimeState();


    /*
       밤
    */

    if(
        time.isNight
    ){

        setOwl(
            "owl_sleep"
        );


        showBubble(
            random(
                EMOTES.sleepy
            ),
            1500
        );


        createEffect(
            "effect_sleep",
            .65,
            .3
        );


        return;

    }


    /*
       낮 자율 행동
    */

    const behavior =
        Math.random();


    /*
       뒤돌기
    */

    if(
        behavior < .18
    ){

        setOwl(
            "owl_back"
        );


        showBubble(
            random(
                EMOTES.back
            ),
            1000
        );

    }


    /*
       갸웃
    */

    else if(
        behavior < .35
    ){

        setOwl(
            "owl_head_tilt",
            "owl-wiggle"
        );


        showBubble(
            random(
                EMOTES.confused
            ),
            1100
        );


        createEffect(
            "effect_question",
            .65,
            .28
        );

    }


    /*
       엿보기
    */

    else if(
        behavior < .50
    ){

        setOwl(
            "owl_peek"
        );


        showBubble(
            random(
                EMOTES.curious
            ),
            1000
        );

    }


    /*
       왼쪽 / 오른쪽 보기
    */

    else if(
        behavior < .62
    ){

        if(
            Math.random() < .5
        ){

            setOwl(
                "owl_side_left"
            );

        }

        else{

            setOwl(
                "owl_side_right"
            );

        }


        showBubble(
            random(
                EMOTES.curious
            ),
            1000
        );

    }


    /*
       옆으로 누워 쉬기
    */

    else if(
        behavior < .72
    ){

        setOwl(
            "owl_sleep_side"
        );


        showBubble(
            random(
                EMOTES.sleepy
            ),
            1200
        );

    }


    /*
       일반
    */

    else if(
        behavior < .86
    ){

        setOwl(
            "owl_normal"
        );

    }


    /*
       혼자 갑자기 신남
    */

    else{

        setOwl(
            "owl_excited",
            "owl-jump"
        );


        createEffect(
            "effect_sparkle",
            .5,
            .33
        );


        showBubble(
            random(
                EMOTES.happy
            ),
            1000
        );

    }


    gameData.lastAction =
        "autonomous";


    save();


    resetIdleTimer();

}


/* ==================================================
   낮밤 실시간 확인
================================================== */

setInterval(

    () => {

        updateDayNight();

    },

    30000

);


/* ==================================================
   주기적 자율 행동
================================================== */

setInterval(

    () => {

        if(
            gameData.started &&
            gameData.stage === 4
        ){

            if(
                Date.now()
                -
                gameData.lastInteraction
                >
                15000
            ){

                autonomousBehavior();

            }

        }

    },

    12000

);


/* ==================================================
   화면 다시 돌아왔을 때
================================================== */

document.addEventListener(

    "visibilitychange",

    () => {

        if(
            !document.hidden
        ){

            updateDayNight();


            if(
                gameData.started
            ){

                gameData.lastInteraction =
                    Date.now();


                const time =
                    getTimeState();


                if(
                    gameData.stage === 4
                    &&
                    time.isNight
                ){

                    setOwl(
                        "owl_sleep"
                    );

                }

                else if(
                    gameData.stage === 4
                ){

                    setOwl(
                        "owl_normal"
                    );

                }


                resetIdleTimer();

            }

        }

    }

);


/* ==================================================
   초기 렌더
================================================== */

function render(){

    startScreen.style.display =
        gameData.started
            ? "none"
            : "flex";


    setOwl(
        getStage().file
    );


    updateDayNight();

}


render();
