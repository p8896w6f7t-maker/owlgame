<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    minimum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<meta
    name="format-detection"
    content="telephone=no"
>

<title>부엉이 키우기</title>

<style>

/* =========================================================
   기본
========================================================= */

*{
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;
    user-drag:none;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    background:#17110f;

    -webkit-text-size-adjust:100%;

    touch-action:none;

    overscroll-behavior:none;
}

body{

    display:flex;

    align-items:center;
    justify-content:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    touch-action:none;

    overscroll-behavior:none;
}


/* =========================================================
   게임
========================================================= */

#game{

    position:relative;

    width:min(100vw,100vh);
    height:min(100vw,100vh);

    max-width:620px;
    max-height:620px;

    overflow:hidden;

    background:#5a4032;

    border-radius:8%;

    isolation:isolate;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    overscroll-behavior:none;

    transform-origin:center center;
}


/* =========================================================
   배경
========================================================= */

#background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

    pointer-events:none;

    -webkit-user-drag:none;

    -webkit-user-select:none;
    user-select:none;

    transition:
        opacity .45s ease;
}


/* =========================================================
   밤 오버레이
========================================================= */

#nightOverlay{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        rgba(
            18,
            10,
            8,
            0
        );

    transition:
        background .8s ease;
}

#game.night #nightOverlay{

    background:
        rgba(
            25,
            13,
            12,
            .12
        );
}


/* =========================================================
   소품 영역
========================================================= */

#props{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;
}


/* =========================================================
   공통 소품
========================================================= */

.prop{

    position:absolute;

    display:block;

    object-fit:contain;

    pointer-events:auto;

    cursor:pointer;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;

    touch-action:none;

    transform-origin:center bottom;

    transition:
        transform .12s ease;
}


/* =========================================================
   선반
   왼쪽으로 이동 + 크게
========================================================= */

#shelf{

    width:39%;

    left:2%;

    top:15%;

    z-index:6;
}


/* =========================================================
   선반 위 세워진 책
========================================================= */

#booksStanding{

    width:24%;

    left:8%;

    top:15.5%;

    z-index:7;

    transform-origin:
        50% 100%;
}


/* =========================================================
   두 권짜리 책
   선반이 아니라 부엉이 오른쪽 바닥
========================================================= */

#booksHorizontal{

    width:18%;

    left:auto;

    right:17%;

    top:auto;

    bottom:19%;

    z-index:11;

    transform-origin:
        50% 100%;
}


/* =========================================================
   화분
========================================================= */

#plant{

    width:23%;

    left:3%;

    bottom:19%;

    z-index:8;

    transform-origin:
        50% 100%;
}


/* =========================================================
   램프
========================================================= */

#lamp{

    width:22%;

    right:3%;

    top:4%;

    z-index:7;

    transform-origin:
        50% 7%;
}


/* =========================================================
   쪽지
========================================================= */

#note{

    width:15%;

    right:15%;

    top:27%;

    z-index:8;

    transform-origin:
        50% 5%;
}


/* =========================================================
   둥지
========================================================= */

#nest{

    position:absolute;

    width:57%;

    left:50%;

    bottom:12%;

    transform:
        translateX(-50%);

    z-index:10;

    pointer-events:auto;

    cursor:pointer;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;

    transform-origin:
        center bottom;
}


/* =========================================================
   부엉이 영역
========================================================= */

#owlArea{

    position:absolute;

    left:50%;

    bottom:18%;

    width:43%;

    height:43%;

    transform:
        translateX(-50%);

    z-index:20;

    display:flex;

    justify-content:center;

    align-items:flex-end;

    pointer-events:auto;

    cursor:pointer;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;

    overscroll-behavior:none;
}


/* =========================================================
   부엉이
========================================================= */

#owl{

    display:block;

    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    pointer-events:none;

    -webkit-user-drag:none;

    user-select:none;
    -webkit-user-select:none;

    filter:
        drop-shadow(
            0 3px 0
            rgba(
                55,
                34,
                25,
                .20
            )
        );

    transform-origin:
        center bottom;

    transition:
        transform .18s ease,
        opacity .15s ease;
}


/* =========================================================
   부엉이 꾹 누르기
========================================================= */

#owlArea.long-press #owl{

    transform:
        translateY(-26px)
        scale(1.04);

    transition:
        transform .18s ease;
}


/* =========================================================
   부엉이 점프
========================================================= */

.owl-jump{

    animation:
        owlJump
        .34s
        ease-out;
}

@keyframes owlJump{

    0%{

        transform:
            translateY(0)
            scale(1);
    }

    45%{

        transform:
            translateY(-12px)
            scale(1.04);
    }

    100%{

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   부엉이 흔들림
========================================================= */

.owl-wiggle{

    animation:
        owlWiggle
        .42s
        ease-in-out;
}

@keyframes owlWiggle{

    0%{
        transform:rotate(0);
    }

    20%{
        transform:rotate(-5deg);
    }

    40%{
        transform:rotate(5deg);
    }

    60%{
        transform:rotate(-3deg);
    }

    80%{
        transform:rotate(2deg);
    }

    100%{
        transform:rotate(0);
    }
}


/* =========================================================
   소품 흔들림
========================================================= */

.shake{

    animation:
        propShake
        .45s
        ease-in-out;
}

@keyframes propShake{

    0%{

        transform:
            rotate(0)
            translateX(0);
    }

    20%{

        transform:
            rotate(-4deg)
            translateX(-2px);
    }

    40%{

        transform:
            rotate(4deg)
            translateX(2px);
    }

    60%{

        transform:
            rotate(-3deg)
            translateX(-1px);
    }

    80%{

        transform:
            rotate(2deg)
            translateX(1px);
    }

    100%{

        transform:
            rotate(0)
            translateX(0);
    }
}


/* =========================================================
   램프 흔들림
========================================================= */

.lamp-shake{

    animation:
        lampShake
        .65s
        ease-in-out;
}

@keyframes lampShake{

    0%{
        transform:rotate(0);
    }

    20%{
        transform:rotate(-5deg);
    }

    40%{
        transform:rotate(4deg);
    }

    60%{
        transform:rotate(-3deg);
    }

    80%{
        transform:rotate(2deg);
    }

    100%{
        transform:rotate(0);
    }
}


/* =========================================================
   둥지 흔들림
========================================================= */

.nest-shake{

    animation:
        nestShake
        .45s
        ease-in-out;
}

@keyframes nestShake{

    0%{

        transform:
            translateX(-50%)
            rotate(0);
    }

    25%{

        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    50%{

        transform:
            translateX(-50%)
            rotate(3deg);
    }

    75%{

        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    100%{

        transform:
            translateX(-50%)
            rotate(0);
    }
}


/* =========================================================
   말풍선
========================================================= */

#bubble{

    position:absolute;

    left:50%;

    bottom:54%;

    min-width:68px;
    max-width:180px;

    padding:
        9px 14px;

    transform:
        translateX(-50%)
        translateY(6px)
        scale(.8);

    opacity:0;

    z-index:50;

    background:#fff6e3;

    border:
        3px solid #593a2b;

    border-radius:18px;

    color:#3d281f;

    font-size:
        clamp(
            17px,
            4vw,
            25px
        );

    font-weight:900;

    line-height:1;

    text-align:center;

    white-space:nowrap;

    box-shadow:
        0 3px 0
        rgba(
            70,
            42,
            30,
            .20
        );

    pointer-events:none;

    transition:
        opacity .15s ease,
        transform .15s ease;
}

#bubble.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* =========================================================
   말풍선 꼬리
========================================================= */

#bubble::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-10px;

    width:15px;
    height:15px;

    background:#fff6e3;

    border-right:
        3px solid #593a2b;

    border-bottom:
        3px solid #593a2b;

    transform:
        translateX(-50%)
        rotate(45deg);
}


/* =========================================================
   효과
========================================================= */

#effects{

    position:absolute;

    inset:0;

    z-index:45;

    pointer-events:none;

    overflow:hidden;
}

.effect{

    position:absolute;

    width:11%;

    height:auto;

    object-fit:contain;

    animation:
        effectPop
        .85s
        ease-out
        forwards;
}

@keyframes effectPop{

    0%{

        opacity:0;

        transform:
            scale(.3)
            translateY(15px);
    }

    20%{
        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            scale(1.15)
            translateY(-35px);
    }
}


/* =========================================================
   버튼
========================================================= */

#buttons{

    position:absolute;

    left:4.2%;
    right:4.2%;

    bottom:2.5%;

    height:18%;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:2.5%;

    z-index:60;

    touch-action:none;
}

.action{

    border:0;

    padding:0;
    margin:0;

    background:transparent;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;
}

.action img{

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    -webkit-user-drag:none;

    user-select:none;
    -webkit-user-select:none;

    filter:
        drop-shadow(
            0 2px 0
            rgba(
                65,
                39,
                28,
                .20
            )
        );

    transition:
        transform .1s ease;
}

.action:active img{

    transform:
        scale(.92);
}


/* =========================================================
   시작 화면
========================================================= */

#startScreen{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(
            38,
            24,
            18,
            .22
        );
}

#startScreen.hidden{

    display:none;
}

#startCard{

    width:70%;

    padding:
        22px 18px;

    background:#fff4df;

    border:
        4px solid #5b3b2b;

    border-radius:24px;

    text-align:center;

    box-shadow:
        0 5px 0
        rgba(
            65,
            40,
            28,
            .25
        );
}

#startEgg{

    display:block;

    width:32%;

    max-width:125px;

    margin:
        0 auto
        9px;
}

#startTitle{

    color:#4c3023;

    font-size:
        clamp(
            22px,
            5vw,
            34px
        );

    font-weight:900;

    margin-bottom:5px;
}

#startSub{

    color:#4c3023;

    opacity:.7;

    font-size:
        clamp(
            12px,
            2.8vw,
            17px
        );

    font-weight:700;

    margin-bottom:17px;
}

#startButton{

    border:
        3px solid #5b3b2b;

    border-radius:15px;

    padding:
        10px 24px;

    background:#e7c28f;

    color:#4c3023;

    font-size:
        clamp(
            15px,
            3.5vw,
            20px
        );

    font-weight:900;

    box-shadow:
        0 3px 0
        #8b6247;

    cursor:pointer;

    touch-action:none;
}

#startButton:active{

    transform:
        translateY(2px);

    box-shadow:
        0 1px 0
        #8b6247;
}


/* =========================================================
   성장 점
========================================================= */

#growthDots{

    position:absolute;

    left:50%;

    bottom:6%;

    transform:
        translateX(-50%);

    z-index:70;

    display:flex;

    gap:5px;

    pointer-events:none;
}

.growthDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:
        rgba(
            255,
            244,
            220,
            .45
        );

    border:
        1px solid
        rgba(
            85,
            53,
            37,
            .5
        );
}

.growthDot.active{

    background:#fff0ca;
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:430px){

    #game{

        width:100vw;
        height:100vw;

        max-width:none;
        max-height:none;

        border-radius:0;
    }
}

</style>

</head>


<body>


<div id="game">


    <!-- =====================================================
         배경
    ====================================================== -->

    <img
        id="background"
        src="bg_day.png"
        alt=""
        draggable="false"
    >

    <div id="nightOverlay"></div>


    <!-- =====================================================
         배경 소품
    ====================================================== -->

    <div id="props">


        <!-- 왼쪽 큰 선반 -->

        <img
            id="shelf"
            class="prop"
            src="shelf.png"
            alt=""
            draggable="false"
        >


        <!-- 선반 위 책 -->

        <img
            id="booksStanding"
            class="prop"
            src="books_standing.png"
            alt=""
            draggable="false"
        >


        <!-- 왼쪽 아래 화분 -->

        <img
            id="plant"
            class="prop"
            src="plant.png"
            alt=""
            draggable="false"
        >


        <!-- 오른쪽 램프 -->

        <img
            id="lamp"
            class="prop"
            src="lamp.png"
            alt=""
            draggable="false"
        >


        <!-- 오른쪽 쪽지 -->

        <img
            id="note"
            class="prop"
            src="note.png"
            alt=""
            draggable="false"
        >


        <!-- 부엉이 오른쪽 바닥의 두 권짜리 책 -->

        <img
            id="booksHorizontal"
            class="prop"
            src="books_horizontal.png"
            alt=""
            draggable="false"
        >

    </div>


    <!-- =====================================================
         둥지
    ====================================================== -->

    <img
        id="nest"
        src="nest.png"
        alt=""
        draggable="false"
    >


    <!-- =====================================================
         부엉이
    ====================================================== -->

    <div id="owlArea">

        <img
            id="owl"
            src="egg.png"
            alt=""
            draggable="false"
        >

    </div>


    <!-- =====================================================
         말풍선
    ====================================================== -->

    <div id="bubble"></div>


    <!-- =====================================================
         효과
    ====================================================== -->

    <div id="effects"></div>


    <!-- =====================================================
         성장 단계
    ====================================================== -->

    <div id="growthDots">

        <div
            class="growthDot active"
            id="dot1"
        ></div>

        <div
            class="growthDot"
            id="dot2"
        ></div>

        <div
            class="growthDot"
            id="dot3"
        ></div>

        <div
            class="growthDot"
            id="dot4"
        ></div>

    </div>


    <!-- =====================================================
         하단 버튼
    ====================================================== -->

    <div id="buttons">


        <button
            class="action"
            id="feedButton"
            type="button"
            aria-label="먹이"
        >

            <img
                src="button_feed.png"
                alt=""
                draggable="false"
            >

        </button>


        <button
            class="action"
            id="playButton"
            type="button"
            aria-label="놀기"
        >

            <img
                src="button_play.png"
                alt=""
                draggable="false"
            >

        </button>


        <button
            class="action"
            id="petButton"
            type="button"
            aria-label="쓰다듬기"
        >

            <img
                src="button_pet.png"
                alt=""
                draggable="false"
            >

        </button>


        <button
            class="action"
            id="talkButton"
            type="button"
            aria-label="말걸기"
        >

            <img
                src="button_talk.png"
                alt=""
                draggable="false"
            >

        </button>


    </div>


    <!-- =====================================================
         시작 화면
    ====================================================== -->

    <div id="startScreen">


        <div id="startCard">


            <img
                id="startEgg"
                src="egg.png"
                alt=""
                draggable="false"
            >


            <div id="startTitle">
                부엉이 키우기
            </div>


            <div id="startSub">
                작은 알에서 부엉이가 태어나요
            </div>


            <button
                id="startButton"
                type="button"
            >
                시작
            </button>


        </div>


    </div>


</div>


<script>

/* =========================================================
   부엉이 키우기
========================================================= */


/* =========================================================
   요소
========================================================= */

const game =
    document.getElementById("game");

const background =
    document.getElementById("background");

const owlArea =
    document.getElementById("owlArea");

const owl =
    document.getElementById("owl");

const nest =
    document.getElementById("nest");

const bubble =
    document.getElementById("bubble");

const effects =
    document.getElementById("effects");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const shelf =
    document.getElementById("shelf");

const booksStanding =
    document.getElementById("booksStanding");

const booksHorizontal =
    document.getElementById("booksHorizontal");

const plant =
    document.getElementById("plant");

const lamp =
    document.getElementById("lamp");

const note =
    document.getElementById("note");


/* =========================================================
   저장
========================================================= */

const STORAGE_KEY =
    "owl_game_state_v5";


const defaultState = {

    started:false,

    growth:0,

    stage:"egg",

    hunger:70,

    mood:70,

    lastUpdate:Date.now()
};


let state =
    loadState();


/* =========================================================
   상태 불러오기
========================================================= */

function loadState(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!saved){

            return {
                ...defaultState
            };
        }

        return {
            ...defaultState,
            ...JSON.parse(saved)
        };

    }catch(error){

        return {
            ...defaultState
        };
    }
}


/* =========================================================
   상태 저장
========================================================= */

function saveState(){

    state.lastUpdate =
        Date.now();

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


/* =========================================================
   성장 단계
========================================================= */

function getStage(){

    if(
        state.growth < 5
    ){

        return "egg";
    }


    if(
        state.growth < 10
    ){

        return "egg_cracked";
    }


    if(
        state.growth < 15
    ){

        return "owl_hatching";
    }


    return "owl_normal";
}


/* =========================================================
   성장 이미지
========================================================= */

function stageImage(stage){

    const images = {

        egg:
            "egg.png",

        egg_cracked:
            "egg_cracked.png",

        owl_hatching:
            "owl_hatching.png",

        owl_normal:
            "owl_normal.png"

    };


    return images[stage] ||
        "egg.png";
}


/* =========================================================
   부엉이 이미지 설정
========================================================= */

function setOwlImage(src){

    owl.src =
        src;


    owl.onerror =
        function(){

            owl.onerror =
                null;

            owl.src =
                "owl_normal.png";
        };
}


/* =========================================================
   성장 표시
========================================================= */

function updateGrowthDots(){

    const dots = [

        document.getElementById(
            "dot1"
        ),

        document.getElementById(
            "dot2"
        ),

        document.getElementById(
            "dot3"
        ),

        document.getElementById(
            "dot4"
        )

    ];


    dots.forEach(
        function(dot){

            dot.classList.remove(
                "active"
            );
        }
    );


    if(
        state.growth >= 0
    ){

        dots[0].classList.add(
            "active"
        );
    }

/* =========================================================
   애니메이션 재생
========================================================= */

function replayClass(
    element,
    className
){

    element.classList.remove(
        className
    );


    void element.offsetWidth;


    element.classList.add(
        className
    );


    setTimeout(
        function(){

            element.classList.remove(
                className
            );

        },
        900
    );
}


/* =========================================================
   효과
========================================================= */

function createEffect(
    image,
    x,
    y
){

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "effect";


    img.src =
        image;


    img.draggable =
        false;


    img.style.left =
        x + "%";


    img.style.top =
        y + "%";


    img.onerror =
        function(){

            img.remove();
        };


    effects.appendChild(
        img
    );


    setTimeout(
        function(){

            img.remove();

        },
        900
    );
}

/* =========================================================
   꾹 누르기 변수
========================================================= */

let pressTimer =
    null;

let pressStartX =
    0;

let pressStartY =
    0;

let isLongPress =
    false;

let pointerDown =
    false;


/* =========================================================
   꾹 누르기 시작
========================================================= */

owlArea.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();
        event.stopPropagation();


        if(
            !state.started
        )
            return;


        pointerDown =
            true;

        isLongPress =
            false;


        pressStartX =
            event.clientX;

        pressStartY =
            event.clientY;


        clearTimeout(
            pressTimer
        );


        try{

            owlArea.setPointerCapture(
                event.pointerId
            );

        }catch(error){}


        pressTimer =
            setTimeout(
                function(){

                    if(
                        !pointerDown
                    )
                        return;


                    isLongPress =
                        true;


                    owlArea.classList.add(
                        "long-press"
                    );


                    showRandomEmote(
                        "happy"
                    );


                    createEffect(
                        "effect_heart.png",
                        51,
                        31
                    );

                },
                300
            );

    },
    {
        passive:false
    }
);


/* =========================================================
   움직임
========================================================= */

owlArea.addEventListener(
    "pointermove",
    function(event){

        if(
            !pointerDown
        )
            return;


        event.preventDefault();


        const dx =
            event.clientX -
            pressStartX;


        const dy =
            event.clientY -
            pressStartY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if(
            distance > 12 &&
            !isLongPress
        ){

            clearTimeout(
                pressTimer
            );
        }

    },
    {
        passive:false
    }
);


/* =========================================================
   꾹 누르기 종료
========================================================= */

function finishOwlPress(event){

    event.preventDefault();
    event.stopPropagation();


    clearTimeout(
        pressTimer
    );


    if(
        !pointerDown
    )
        return;


    pointerDown =
        false;


    owlArea.classList.remove(
        "long-press"
    );


    if(
        isLongPress
    ){

        isLongPress =
            false;


        setOwlImage(
            "owl_normal.png"
        );


        showRandomEmote(
            "love"
        );


        return;
    }


    isLongPress =
        false;


    owlShortTap();
}


owlArea.addEventListener(
    "pointerup",
    finishOwlPress,
    {
        passive:false
    }
);


owlArea.addEventListener(
    "pointercancel",
    finishOwlPress,
    {
        passive:false
    }
);

/* =========================================================
   낮 / 밤
========================================================= */

function updateDayNight(){

    const hour =
        new Date().getHours();


    const night =
        hour >= 19 ||
        hour < 6;


    if(
        night
    ){

        if(
            !background.src.endsWith(
                "bg_night.png"
            )
        ){

            background.style.opacity =
                "0";


            setTimeout(
                function(){

                    background.src =
                        "bg_night.png";

                    background.style.opacity =
                        "1";

                },
                180
            );
        }


        game.classList.add(
            "night"
        );

    }else{

        if(
            !background.src.endsWith(
                "bg_day.png"
            )
        ){

            background.style.opacity =
                "0";


            setTimeout(
                function(){

                    background.src =
                        "bg_day.png";

                    background.style.opacity =
                        "1";

                },
                180
            );
        }


        game.classList.remove(
            "night"
        );
    }
}


updateDayNight();


setInterval(
    updateDayNight,
    60000
);


/* =========================================================
   상태 감소
========================================================= */

function updateStats(){

    if(
        !state.started
    )
        return;


    const now =
        Date.now();


    const elapsed =
        now -
        state.lastUpdate;


    if(
        elapsed < 60000
    )
        return;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    if(
        state.stage ===
        "owl_normal"
    ){

        state.hunger =
            Math.max(
                0,
                state.hunger -
                minutes
            );


        state.mood =
            Math.max(
                0,
                state.mood -
                Math.floor(
                    minutes / 2
                )
            );
    }


    saveState();
}


setInterval(
    updateStats,
    60000
);

            "owl_back.png"
        );


        showRandomEmote(
            "back"
        );


        setTimeout(
            function(){

                setOwlImage(
                    "owl_normal.png"
                );

            },
            1400
        );


        return;
    }


    if(
        random < .62
    ){

        setOwlImage(
            "owl_sleep.png"
        );


        showRandomEmote(
            "sleepy"
        );


        setTimeout(
            function(){

                setOwlImage(
                    "owl_normal.png"
                );

            },
            1800
        );
    }
}


setInterval(
    idleBehavior,
    12000
);


/* =========================================================
   다시 앱으로 돌아왔을 때
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden
        ){

            updateStats();

            updateDayNight();

            updateGame();
        }
    }
);


/* =========================================================
   종료 전 저장
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        saveState();
    }
);


/* =========================================================
   초기 갱신
========================================================= */

updateGame();

updateGrowthDots();

</script>
